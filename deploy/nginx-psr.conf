# psr.rascroi.ru — обратный прокси nginx на приложение подетального учёта.
#
# Установка:
#   1) sudo cp deploy/nginx-psr.conf /etc/nginx/sites-available/psr.conf
#   2) sudo ln -s /etc/nginx/sites-available/psr.conf /etc/nginx/sites-enabled/
#   3) sudo htpasswd -c /etc/nginx/.htpasswd-psr psr   # пароль на время теста
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d psr.rascroi.ru          # сам добавит TLS и https-редирект
#
# После certbot этот server-блок останется на :80 как редирект, а трафик
# пойдёт по https. Приложение слушает 127.0.0.1:5001 (systemd, режим --http).

server {
    listen 80;
    server_name psr.rascroi.ru;

    # На время теста — вход по паролю, чтобы боевые данные не были открыты в интернет.
    auth_basic "PSR (test)";
    auth_basic_user_file /etc/nginx/.htpasswd-psr;

    # Загрузка выгрузок 1С (.xlsx) и .xbir через админку.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
